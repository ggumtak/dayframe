name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test "scripts/updates/*.test.mjs"
      # Bundles the JavaScript exactly as the release build will, without the native toolchain.
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          EXPO_NO_TELEMETRY: '1'

  # Tells a reviewer whether a pull request can ship as an over-the-air update or needs a new APK
  # (apps/mobile/scripts/updates/README.md). Informational: it never fails the check.
  native-fingerprint:
    name: Native fingerprint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Fingerprint the pull request and its base
        continue-on-error: true
        run: |
          cp -R scripts/updates "$RUNNER_TEMP/updates"
          npx --no -- expo-updates fingerprint:generate --platform android > "$RUNNER_TEMP/head.json"
          lock="$(sha256sum package-lock.json)"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --quiet --detach "$BASE_SHA"
          if [[ "$(sha256sum package-lock.json)" != "$lock" ]]; then npm ci; fi
          npx --no -- expo-updates fingerprint:generate --platform android > "$RUNNER_TEMP/base.json" || echo '{}' > "$RUNNER_TEMP/base.json"
          gh release download --pattern android-runtime-version.txt --output "$RUNNER_TEMP/released.txt" || true
      - name: Report
        continue-on-error: true
        run: |
          node "$RUNNER_TEMP/updates/compare-fingerprints.mjs" --head "$RUNNER_TEMP/head.json" --base "$RUNNER_TEMP/base.json" \
            --released "$RUNNER_TEMP/released.txt" >> "$GITHUB_STEP_SUMMARY"
