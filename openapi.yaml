openapi: 3.1.0
info:
  title: Dayframe API
  version: 1.0.0
  description: REST API for tasks, schedules, habits, focus and in-app updates.
servers:
  - url: https://{projectRef}.supabase.co/functions/v1/api/v1
    variables:
      projectRef:
        default: exampleprojectref
  - url: http://127.0.0.1:54321/functions/v1/api/v1
tags:
  - name: Account
    description: Profile and default time zone.
  - name: Organization
    description: Projects, sections and reusable tags.
  - name: Tasks
    description: Task trees, parsing, completion and rescheduling.
  - name: Habits
    description: Habit schedules, progress logs and statistics.
  - name: Focus
    description: Pomodoro and focus session history.
  - name: Assistants
    description: Connections that let an AI assistant act on the account through the Model Context Protocol.
  - name: Releases
    description: Public mobile update metadata.
security:
  - SupabaseJwt: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Get your profile
      tags:
        - Account
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input, reference, or schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Supabase access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Action unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Resource or published release not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Unique conflict, stale revision, or incompatible retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Upstream service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateMe
      summary: Update your profile
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Successful response.
