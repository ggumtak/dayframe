components:
  securitySchemes:
    SupabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: *a4
        display_name:
          anyOf:
            - &a11
              type: string
            - type: "null"
        timezone: *a11
        created_at: &a12
          type: string
          format: date-time
      required:
        - id
        - display_name
        - timezone
        - created_at
      additionalProperties: false
    Project:
      type: object
      properties:
        id: *a4
        user_id: *a4
        created_at: *a12
        name: *a11
        position: &a13
          type: integer
      required:
        - id
        - user_id
        - created_at
        - name
        - position
      additionalProperties: false
    Section:
      type: object
      properties:
        id: *a4
        user_id: *a4
        created_at: *a12
        name: *a11
        position: *a13
        project_id: *a4
      required:
        - id
        - user_id
        - created_at
        - name
        - position
        - project_id
      additionalProperties: false
    Tag:
      type: object
      properties:
        id: *a4
        user_id: *a4
        created_at: *a12
        name: *a11
      required:
        - id
        - user_id
        - created_at
        - name
      additionalProperties: false
    Task:
      type: object
      properties:
        id: *a4
        user_id: *a4
        created_at: *a12
        project_id:
          anyOf:
            - *a4
            - type: "null"
        section_id:
          anyOf:
            - *a4
            - type: "null"
        parent_task_id:
          anyOf:
            - *a4
            - type: "null"
        title: *a11
        notes: &a14
          anyOf:
            - *a11
            - type: "null"
        priority: &a15
          enum:
            - 1
            - 2
            - 3
            - 4
        position: *a13
        due_at: &a16
          anyOf:
            - *a12
            - type: "null"
        all_day: &a17
          type: boolean
        timezone: *a11
        recurrence_rule: &a18
          anyOf:
            - *a11
            - type: "null"
        recurrence_anchor_at: &a19
          anyOf:
            - *a12
            - type: "null"
        recurrence_local_time: &a20
          anyOf:
            - *a11
            - type: "null"
        completed_at: &a21
          anyOf:
            - *a12
            - type: "null"
        updated_at: *a12
      required:
        - id
        - user_id
        - created_at
        - project_id
        - section_id
        - parent_task_id
        - title
        - notes
        - priority
        - position
        - due_at
        - all_day
        - timezone
        - recurrence_rule
        - recurrence_anchor_at
        - recurrence_local_time
        - completed_at
        - updated_at
      additionalProperties: false
    Subtask:
      type: object
      properties:
        id: *a4
        user_id: *a4
        created_at: *a12
        project_id:
          type: "null"
        section_id:
          type: "null"
        parent_task_id: *a4
        title: *a11
        notes: *a14
        priority: *a15
        position: *a13
        due_at: *a16
        all_day: *a17
        timezone: *a11
        recurrence_rule: *a18
        recurrence_anchor_at: *a19
        recurrence_local_time: *a20
        completed_at: *a21
        updated_at: *a12
      required:
        - id
        - user_id
        - created_at
        - project_id
        - section_id
        - parent_task_id
        - title
        - notes
        - priority
        - position
        - due_at
        - all_day
        - timezone
        - recurrence_rule
